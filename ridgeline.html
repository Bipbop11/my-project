<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ridgeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500&display=swap">
<style>
  /* Layout: full-bleed canvas, thin type floating over the dusk sky. Single dusk look in every theme. */
  :root {
    --sky-top: #27315c;
    --ink: #1d2140;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.74);
    --accent: #e2574c;
    --gold: #f6c453;
    --font: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--sky-top);
    color: var(--text);
    font-family: var(--font);
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: pointer;
    outline: none;
  }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    pointer-events: none;
    text-shadow: 0 1px 10px rgba(20, 24, 50, 0.45);
  }
  .hud-right { display: flex; align-items: center; gap: 14px; }
  .dist {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .sub {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .hud-right .sub { margin-top: 0; }
  #score { transform-origin: left center; }
  #score.bump { animation: bump 0.35s ease-out; }
  @keyframes bump {
    0% { transform: scale(1); color: var(--text); }
    35% { transform: scale(1.18); color: var(--gold); }
    100% { transform: scale(1); }
  }
  #pauseBtn {
    pointer-events: auto;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.6);
    background: rgba(29, 33, 64, 0.3);
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  #pauseBtn:hover { background: rgba(29, 33, 64, 0.5); }
  #pauseBtn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  #pauseBtn svg { width: 16px; height: 16px; fill: currentColor; }
  #menu {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .menu-card {
    width: min(320px, 100%);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 20px;
    padding: 28px 28px 22px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(29, 33, 64, 0.72);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    text-align: center;
    box-shadow: 0 18px 50px rgba(15, 18, 40, 0.35);
  }
  .menu-card h2 {
    margin: 0;
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    text-transform: uppercase;
  }
  .menu-card .stats { justify-content: center; }
  .menu-actions { display: flex; flex-direction: column; gap: 10px; }
  .menu-actions button {
    height: 48px;
    border-radius: 999px;
    font: 500 13px/1 var(--font);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn-primary { background: var(--text); color: var(--ink); border: 1.5px solid var(--text); }
  .btn-primary:hover { background: rgba(255, 255, 255, 0.88); }
  .btn-secondary { background: transparent; color: var(--text); border: 1.5px solid rgba(255, 255, 255, 0.5); }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
  .menu-actions button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .menu-hint {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #toast {
    position: fixed;
    left: 50%;
    top: 24%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: clamp(16px, 3vw, 24px);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 1px 12px rgba(29, 33, 64, 0.5);
  }
  #toast.show { animation: pop 1.4s ease-out forwards; }
  body.is-paused #toast { animation-play-state: paused; }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, 8px); }
    15% { opacity: 1; transform: translate(-50%, 0); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -14px); }
  }
  #panel {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding-top: calc(env(safe-area-inset-top, 0px) + 13vh);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
    background: linear-gradient(rgba(29, 33, 64, 0.55), rgba(29, 33, 64, 0) 60%);
  }
  .card { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #panel h1, #panel h2 {
    margin: 0;
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: 0.3em;
    padding-left: 0.3em;
    text-wrap: balance;
  }
  #panel h1 { font-size: clamp(38px, 9vw, 84px); }
  #panel h2 { font-size: clamp(28px, 6vw, 52px); }
  #panel p {
    margin: 0;
    max-width: 36ch;
    line-height: 1.55;
    font-size: 15px;
    color: var(--muted);
  }
  .stats { display: flex; gap: 32px; font-variant-numeric: tabular-nums; }
  .stat b { display: block; font-size: 30px; font-weight: 300; }
  .stat span {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cta {
    margin-top: 6px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) {
    .cta { animation: none; }
  }
</style>
</head>
<body>
<canvas id="game" tabindex="-1" aria-label="Ridgeline. Press Space or Up to jump, hold in the air to backflip. Click or press P to pause."></canvas>

<div id="hud" hidden>
  <div>
    <div class="dist" id="dist">0 m</div>
    <div class="sub" id="score">Score 0</div>
    <div class="sub" id="haul">Coins 0</div>
  </div>
  <div class="hud-right">
    <div class="sub" id="best">Best 0</div>
    <button id="pauseBtn" type="button" aria-label="Pause">
      <svg id="iconPause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"></rect><rect x="9.5" y="2" width="3.5" height="12" rx="1"></rect></svg>
      <svg id="iconPlay" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M4 2.2v11.6c0 .6.7 1 1.2.6l8.4-5.8c.4-.3.4-.9 0-1.2L5.2 1.6C4.7 1.2 4 1.6 4 2.2z"></path></svg>
    </button>
  </div>
</div>

<div id="toast" aria-live="polite"></div>

<div id="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle" hidden>
  <div class="menu-card">
    <h2 id="menuTitle">Paused</h2>
    <div class="stats">
      <div class="stat"><b id="mScore">0</b><span>Score</span></div>
      <div class="stat"><b id="mDist">0</b><span>Metres</span></div>
    </div>
    <div class="menu-actions">
      <button id="resumeBtn" class="btn-primary" type="button">Resume</button>
      <button id="restartBtn" class="btn-secondary" type="button">Restart</button>
    </div>
    <div class="menu-hint">P or Esc to resume</div>
  </div>
</div>

<div id="panel">
  <div class="card" id="intro">
    <h1>Ridgeline</h1>
    <p>Press Space or Up to jump. Hold it in the air to backflip. Land with your board along the slope. Click the screen or press P to pause.</p>
    <div class="cta">Press Space to ride</div>
  </div>
  <div class="card" id="over" hidden>
    <h2>Wiped out</h2>
    <div class="stats">
      <div class="stat"><b id="oDist">0</b><span>Metres</span></div>
      <div class="stat"><b id="oScore">0</b><span>Score</span></div>
      <div class="stat"><b id="oBest">0</b><span>Best</span></div>
    </div>
    <div class="cta">Press Space to ride again</div>
  </div>
</div>

<script>
'use strict';

// ---------- Tuning constants ----------
// Physics
const G = 1600;              // gravity, world units per second squared
const FALL_MULT = 1.2;       // extra gravity while falling, for a weightier arc
const STEP = 1 / 120;        // fixed physics timestep (seconds)
const MAX_FRAME = 0.1;       // clamp long frames (tab switches) to avoid a spiral of catch-up steps
const MIN_SPEED = 180;       // the rider never fully stalls on uphills
const MAX_SPEED = 1550;
const SNOW_MU = 0.03;        // snow friction coefficient, scaled by the normal force
const AIR_DRAG = 0.0003;     // quadratic air drag
const BOOST_ACCEL = 650;     // extra acceleration while a flip boost is active
const JUMP = 600;            // jump impulse along the slope normal
const COYOTE_TIME = 0.1;     // a jump pressed just after rolling off a crest still counts
// Spin and landing
const ROT_MAX = 7.6;         // max backflip spin, radians per second
const SPIN_DELAY = 0.12;     // hold time after a jump before the spin begins
const CRASH_ANGLE = 0.85;    // landing tolerance against the slope, radians (about 49 degrees)
const PERFECT_ANGLE = 0.22;  // tighter tolerance for a perfect landing (about 13 degrees)
const ASSIST_RANGE = 0.6;    // when not spinning, ease the board toward the slope inside this range
// Camera
const CAM_FOLLOW_X = 10;     // horizontal camera smoothing rate (per second)
const CAM_FOLLOW_Y = 4;      // vertical camera smoothing rate (per second)
const ZOOM_OUT = 0.12;       // how far the camera pulls back at top speed
// Misc
const PX_PER_M = 40;         // world units per metre shown in the HUD
const SCARF_POINTS = 8;
const TRAIL_MAX = 160;
const TAU = Math.PI * 2;
const DOT = String.fromCharCode(183);
const GAME_KEYS = new Set(['Space', 'ArrowUp', 'KeyW']);
// Entities
const COIN_R = 9;            // coin radius in world units
const COIN_POINTS = 10;
const JAGUAR_POINTS = 250;
const PLAYER_HIT_R = 20;     // player hit circle, centred on the torso
const SPAWN_MARGIN = 220;    // spawn this far beyond the right edge of the view
const DESPAWN_MARGIN = 120;  // remove this far behind the left edge of the view

// Flat-design dusk palette used by the canvas
const C = {
  skyTop: '#27315c', skyMid: '#8c6f9f', skyLow: '#f2a58a', sun: '#ffe1c4',
  far: '#9a8bbb', near: '#615a92', haze: 'rgba(242, 165, 138, 0.28)',
  snow: '#eef0f8', rim: '#e4e6f3', shade1: '#d6d9ec', shade2: '#c1c4de',
  carve: 'rgba(150, 156, 196, 0.55)', tree: '#3a3f6b', ink: '#1d2140',
  scarf: '#e2574c', spray: '#ffffff', boost: '#ffd2a6',
  gold: '#f6c453', goldDark: '#d99a2b', goldLight: '#fde7a6',
  jaguar: '#e39b3a', jaguarDark: '#c47d27', spots: '#4f3420'
};

// ---------- Terrain: a downward base slope plus layered sine waves ----------
// Sines are continuous everywhere, so slope transitions are always seamless.
const BASE_SLOPE = 0.22;
const TERRAIN = [
  { a: 140, f: 0.0021, p: 1.0 },
  { a: 55, f: 0.0063, p: 2.1 },
  { a: 10, f: 0.013, p: 0.4 }
];
function groundY(x) {
  let y = BASE_SLOPE * x;
  for (const t of TERRAIN) y += t.a * Math.sin(t.f * x + t.p);
  return y;
}
function groundD1(x) {
  let d = BASE_SLOPE;
  for (const t of TERRAIN) d += t.a * t.f * Math.cos(t.f * x + t.p);
  return d;
}
function groundD2(x) {
  let d = 0;
  for (const t of TERRAIN) d -= t.a * t.f * t.f * Math.sin(t.f * x + t.p);
  return d;
}
// Slope under the whole board (nose to tail) rather than a single point; fairer on curved ground
function boardSlope(x) {
  return Math.atan2(groundY(x + 18) - groundY(x - 18), 36);
}

// ---------- Helpers ----------
function wrapAngle(a) {
  a = (a + Math.PI) % TAU;
  if (a < 0) a += TAU;
  return a - Math.PI;
}
function hash(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function tri(u) {
  const t = u - Math.floor(u);
  return 1 - Math.abs(t * 2 - 1);
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpAngle(a, b, t) { return a + wrapAngle(b - a) * t; }
// Frame-rate independent lerp factor for a smoothing rate per second
function smoothing(rate, dt) { return 1 - Math.exp(-rate * dt); }
const $ = (id) => document.getElementById(id);

// ---------- Canvas and viewport ----------
const cv = $('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, baseScale = 1, scale = 1, viewW = 0, viewH = 0;

function measure() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  // Fit roughly 900 x 620 world units, but never zoom out so far that phones get a tiny rider
  baseScale = Math.max(Math.min(H / 620, W / 900), Math.min(H / 620, 0.62));
  applyZoom();
}
function applyZoom() {
  scale = baseScale * cam.zoom;
  viewW = W / scale;
  viewH = H / scale;
}

// ---------- Game state ----------
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let state = 'ready';         // 'ready' | 'playing' | 'crashed'
let paused = false;
let best = 0;
let bonus = 0;
let time = 0;
const p = {};
const cam = { x: 0, y: 0, px: 0, py: 0, vel: 0, zoom: 1, shake: 0, renderX: 0 };
const input = { down: false, age: 0, delay: 0 };
const held = new Set();      // every key and pointer currently holding the input
const particles = [];
const rings = [];
const scarf = [];
const trail = [];
const flakes = [];
const coins = [];
const jaguars = [];
const pops = [];             // expanding circles for coin and jaguar pickups
const coinPool = [];         // recycled coin objects, so long runs do not churn memory
let coinCount = 0;
let jaguarCount = 0;
let nextCoinX = 0;           // world x where the next coin pattern starts
let nextJaguarX = 0;         // world x where the next jaguar appears

function loadBest() {
  try { return parseInt(localStorage.getItem('ridgeline-best') || '0', 10) || 0; } catch (e) { return 0; }
}
function saveBest() {
  try { localStorage.setItem('ridgeline-best', String(best)); } catch (e) { /* storage unavailable */ }
}

function reset() {
  Object.assign(p, {
    x: 0, y: groundY(0), v: 0, vx: 0, vy: 0,
    angle: Math.atan(groundD1(0)), angVel: 0,
    air: false, jumped: false, airT: 0, rot: 0, boost: 0, crashT: 0, squash: 0
  });
  p.px = p.x; p.py = p.y; p.pa = p.angle; p.ps = 0;
  bonus = 0;
  cam.vel = 0;
  cam.zoom = 1;
  cam.shake = 0;
  applyZoom();
  particles.length = 0;
  rings.length = 0;
  trail.length = 0;
  pops.length = 0;
  while (coins.length) coinPool.push(coins.pop());
  jaguars.length = 0;
  coinCount = 0;
  jaguarCount = 0;
  nextCoinX = 700;
  nextJaguarX = 2600;
  snapCamera();
  initScarf();
}

function camAnchor() {
  // Portrait screens show more sky above, so sit the rider a little higher
  return H > W ? 0.45 : 0.5;
}
function camTargetX() {
  // Lead by the smoothing lag (velocity / rate) so the rider settles exactly on the left third
  return p.x - viewW / 3 + cam.vel / CAM_FOLLOW_X;
}
function camTargetY() {
  // Blend the rider height with the ground ahead so descents stay in view
  return p.y * 0.6 + groundY(p.x + viewW * 0.35) * 0.4 - viewH * camAnchor();
}
function snapCamera() {
  cam.x = cam.px = camTargetX();
  cam.y = cam.py = camTargetY();
  cam.renderX = cam.x;
}

function start() {
  state = 'playing';
  p.v = 260;
  $('panel').hidden = true;
  $('hud').hidden = false;
}

// ---------- Pause ----------
let rafId = 0;

function pause() {
  if (paused || state !== 'playing') return;
  paused = true;
  held.clear();
  input.down = false;
  cancelAnimationFrame(rafId);
  document.body.classList.add('is-paused');
  setPauseButton();
  drawPausedFrame();
  openMenu();
}

function resume() {
  if (!paused) return;
  paused = false;
  closeMenu();
  document.body.classList.remove('is-paused');
  setPauseButton();
  startLoop();
}

function restartRun() {
  const wasPaused = paused;
  paused = false;
  closeMenu();
  document.body.classList.remove('is-paused');
  setPauseButton();
  $('over').hidden = true;
  reset();
  start();
  input.delay = Infinity;
  if (wasPaused) startLoop(); // the loop was stopped by pause()
}

// ---------- Pause menu ----------
function openMenu() {
  $('mScore').textContent = score().toLocaleString('en-US');
  $('mDist').textContent = distance().toLocaleString('en-US');
  $('hud').hidden = true;
  $('menu').hidden = false;
  $('resumeBtn').focus({ preventScroll: true });
}

function closeMenu() {
  // Move focus off the menu buttons so Space goes back to jumping
  if ($('menu').contains(document.activeElement)) document.activeElement.blur();
  $('menu').hidden = true;
  if (state === 'playing') $('hud').hidden = false;
}

function togglePause() {
  if (paused) resume(); else pause();
}

function setPauseButton() {
  $('iconPause').hidden = paused;
  $('iconPlay').hidden = !paused;
  $('pauseBtn').setAttribute('aria-label', paused ? 'Resume' : 'Pause');
}

function drawPausedFrame() {
  // Freeze the last frame and dim it; the HTML menu sits on top
  render(1, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(29, 33, 64, 0.5)';
  ctx.fillRect(0, 0, W, H);
}

// ---------- Input ----------
// Jumping and flipping are keyboard only. Mouse and touch never reach press(); they pause instead.
// Several keys (Space, Up, W) can hold the input at once.
// The press fires on the first key down; the release fires only when the last key lets go.
function inputDown(id) {
  const wasDown = held.size > 0;
  held.add(id);
  if (!wasDown) press();
}
function inputUp(id) {
  if (!held.delete(id)) return;
  if (held.size === 0) release();
}
function inputClear() {
  held.clear();
  release();
}

// Game actions run synchronously inside the event handler, so a jump is applied before the next frame
function press() {
  input.down = true;
  input.age = 0;
  if (paused) return; // menu is open; keys there act on the focused button
  if (state === 'ready') {
    start();
    input.delay = Infinity; // the start key should not spin the rider
    return;
  }
  if (state === 'crashed') {
    if (p.crashT > 0.7) restartRun();
    return;
  }
  if (!p.air || (!p.jumped && p.airT < COYOTE_TIME)) {
    jump();
    input.delay = SPIN_DELAY; // short grace so a quick tap jumps without flipping
  } else {
    input.delay = 0;          // a fresh press in the air spins immediately
  }
}
function release() { input.down = false; }

// Keyboard: the only path to jump and flip
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyP' || e.code === 'Escape') {
    e.preventDefault();
    if (!e.repeat) togglePause();
    return;
  }
  // While the menu is open, let Space and Enter activate the focused menu button natively
  if (paused) return;
  if (GAME_KEYS.has(e.code)) {
    e.preventDefault(); // stop page scrolling and stray button activation
    if (!e.repeat) inputDown(e.code);
  }
});
window.addEventListener('keyup', (e) => {
  if (GAME_KEYS.has(e.code)) {
    if (!paused) e.preventDefault();
    inputUp(e.code); // always release, even if the key was pressed before pausing
  }
});
window.addEventListener('blur', inputClear);

// Mouse and touch: pause during a run, start or restart on the title and game-over screens
cv.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (state === 'playing') pause();
  else if (state === 'ready') start();
  else if (state === 'crashed' && p.crashT > 0.7) restartRun();
});
cv.addEventListener('contextmenu', (e) => e.preventDefault());

$('pauseBtn').addEventListener('click', (e) => {
  e.currentTarget.blur(); // keep Space bound to jumping, not to this button
  togglePause();
});
$('resumeBtn').addEventListener('click', resume);
$('restartBtn').addEventListener('click', restartRun);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    inputClear();
    pause();
  }
});

// ---------- Resize ----------
function onResize() {
  measure();
  snapCamera();
  seedFlakes();
  if (paused) drawPausedFrame();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

// ---------- Physics ----------
function jump() {
  // From the ground use the live slope; during coyote time use the slope just left behind
  const th = p.air ? Math.atan2(p.vy, p.vx) : Math.atan(groundD1(p.x));
  const speed = p.air ? Math.hypot(p.vx, p.vy) : p.v;
  // Launch along the current velocity plus an impulse along the slope normal
  p.vx = Math.max(120, speed * Math.cos(th) + Math.sin(th) * JUMP);
  p.vy = speed * Math.sin(th) - Math.cos(th) * JUMP;
  takeOff(true);
  p.squash = -0.35; // a quick stretch on take-off
  burst(8, 0.6);
}

function takeOff(jumped) {
  p.air = true;
  p.jumped = jumped;
  p.airT = 0;
  p.rot = 0;
  p.angVel = 0;
  trail.push(null); // break the carve line while airborne
}

function stepGround(dt) {
  const th = Math.atan(groundD1(p.x));
  // Gravity along the slope, minus snow friction (scaled by the normal force) and air drag
  let a = G * Math.sin(th) - SNOW_MU * G * Math.cos(th) - AIR_DRAG * p.v * p.v;
  if (p.boost > 0) {
    a += BOOST_ACCEL * Math.min(1, p.boost); // fade the boost out over its last second
    p.boost -= dt;
  }
  p.v = clamp(p.v + a * dt, MIN_SPEED, MAX_SPEED);

  const vx = p.v * Math.cos(th);
  // Leave the ground on crests where the slope falls away faster than gravity can follow
  if (groundD2(p.x) * vx * vx > G * 1.05) {
    p.vx = vx;
    p.vy = p.v * Math.sin(th);
    takeOff(false);
    return;
  }
  p.x += vx * dt;
  p.y = groundY(p.x);
  p.angle = lerpAngle(p.angle, th, smoothing(18, dt));

  addTrailPoint();
  if (Math.random() < p.v / 900) spray(th);
}

function stepAir(dt) {
  p.airT += dt;
  p.vy += G * (p.vy > 0 ? FALL_MULT : 1) * dt;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (p.boost > 0) p.boost -= dt;

  // Holding spins backwards (counter-clockwise on screen); releasing lets the spin die out
  const spinning = input.down && input.age >= input.delay;
  if (spinning) {
    p.angVel = lerp(p.angVel, -ROT_MAX, smoothing(9, dt));
  } else {
    p.angVel *= Math.exp(-dt * 5);
    // Landing assist: once the spin has mostly settled, ease the board toward the slope below
    if (Math.abs(p.angVel) < 1.5) {
      const d = wrapAngle(boardSlope(p.x) - p.angle);
      if (Math.abs(d) < ASSIST_RANGE) p.angle += d * smoothing(2.5, dt);
    }
  }
  p.angle += p.angVel * dt;
  p.rot += p.angVel * dt;

  const gy = groundY(p.x);
  if (p.y >= gy) land(gy);
}

function land(gy) {
  const th = boardSlope(p.x);
  const diff = wrapAngle(p.angle - th);
  p.y = gy;
  // Split the velocity into the part along the slope and the impact into it
  const along = p.vx * Math.cos(th) + p.vy * Math.sin(th);
  const impact = Math.max(0, -p.vx * Math.sin(th) + p.vy * Math.cos(th));

  if (Math.abs(diff) > CRASH_ANGLE) {
    crash(along);
    return;
  }

  p.air = false;
  p.angle = th + diff;
  p.angVel = 0;
  // Sloppy landings bleed some speed; clean ones keep all of it
  const quality = Math.abs(diff) / CRASH_ANGLE;
  let v = along * (1 - 0.2 * quality * quality);
  const flips = Math.round(Math.abs(p.rot) / TAU);
  const perfect = Math.abs(diff) < PERFECT_ANGLE;
  if (flips > 0) {
    v += 140 * flips + (perfect ? 90 : 0);
    p.boost = Math.max(p.boost, 1 + 0.5 * flips);
    const pts = 100 * flips + (perfect ? 50 : 0);
    bonus += pts;
    const name = flips > 1 ? flips + 'x Backflip' : 'Backflip';
    toast(name + (perfect ? ' ' + DOT + ' Perfect' : '') + '  +' + pts);
  }
  if (perfect && p.airT > 0.35) rings.push({ x: p.x, y: p.y, t: 0 });
  p.v = clamp(v, MIN_SPEED, MAX_SPEED);
  // Knees absorb the impact, and the camera feels it a little
  p.squash = clamp(impact / 700, 0.25, 1);
  addShake(Math.min(6, impact / 160));
  burst(Math.round(8 + impact / 80), 0.8);
}

function crash(along) {
  state = 'crashed';
  p.air = false;
  p.crashT = 0;
  p.v = Math.max(0, along);
  p.boost = 0;
  $('hud').hidden = true;
  addShake(10);
  burst(26, 1.4);
}

function stepCrash(dt) {
  p.crashT += dt;
  const th = Math.atan(groundD1(p.x));
  p.v = Math.max(0, p.v - 1100 * dt);
  p.x += p.v * Math.cos(th) * dt;
  p.y = groundY(p.x);
  // Tumble onto the back
  p.angle = lerpAngle(p.angle, th - 1.45, smoothing(8, dt));
  if (p.crashT > 0.6 && $('over').hidden) showGameOver();
}

function addShake(amount) {
  if (!reducedMotion) cam.shake = Math.max(cam.shake, amount);
}

// ---------- Trail: the carve line the board leaves in the snow ----------
function addTrailPoint() {
  const tx = p.x - Math.cos(p.angle) * 14;
  const lastPt = trail[trail.length - 1];
  if (lastPt && Math.abs(tx - lastPt.x) < 8) return;
  trail.push({ x: tx, y: groundY(tx) + 1.5 });
  if (trail.length > TRAIL_MAX) trail.shift();
}

// ---------- Particles ----------
function emit(x, y, vx, vy, life, r, color) {
  if (particles.length > 320) particles.shift();
  particles.push({ x, y, px: x, py: y, vx, vy, life, max: life, r, color });
}
function spray(th) {
  const tx = p.x - Math.cos(p.angle) * 18;
  const ty = p.y - Math.sin(p.angle) * 18;
  const color = p.boost > 0 ? C.boost : css(mixColor(L.snow, [255, 255, 255], 0.5));
  emit(tx, ty, -p.v * 0.12 * Math.cos(th) + (Math.random() - 0.5) * 60,
       -100 - Math.random() * 140, 0.45 + Math.random() * 0.3, 2 + Math.random() * 2.5, color);
}
function burst(n, power) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * Math.random();
    const s = (80 + Math.random() * 220) * power;
    emit(p.x, p.y, Math.cos(a) * s, Math.sin(a) * s, 0.4 + Math.random() * 0.5, 2 + Math.random() * 3, css(mixColor(L.snow, [255, 255, 255], 0.5)));
  }
}
function stepParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    if (q.life <= 0) { particles.splice(i, 1); continue; }
    q.px = q.x;
    q.py = q.y;
    q.vx *= Math.exp(-dt * 1.5); // light air drag on spray
    q.vy += 700 * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    rings[i].t += dt;
    if (rings[i].t > 0.5) rings.splice(i, 1);
  }
}

// ---------- Scarf: a short verlet rope pinned at the rider's neck ----------
function neckAt(x, y, angle, squash) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const lx = 3, ly = -31 + squash * 7;
  return { x: x + c * lx - s * ly, y: y + s * lx + c * ly };
}
function initScarf() {
  const n = neckAt(p.x, p.y, p.angle, 0);
  scarf.length = 0;
  for (let i = 0; i < SCARF_POINTS; i++) {
    const x = n.x - i * 5;
    scarf.push({ x, y: n.y, ox: x, oy: n.y, px: x, py: n.y });
  }
}
function stepScarf(dt) {
  const n = neckAt(p.x, p.y, p.angle, p.squash);
  for (const s of scarf) { s.px = s.x; s.py = s.y; }
  scarf[0].x = n.x;
  scarf[0].y = n.y;
  // Integrate: strong damping acts as air drag, so the scarf streams behind the rider
  for (let i = 1; i < scarf.length; i++) {
    const s = scarf[i];
    const vx = (s.x - s.ox) * 0.96;
    const vy = (s.y - s.oy) * 0.96;
    s.ox = s.x;
    s.oy = s.y;
    s.x += vx;
    s.y += vy + 400 * dt * dt + Math.sin(time * 22 + i * 0.9) * 0.18 * (i / scarf.length);
  }
  // Keep segment lengths fixed; the neck point is pinned
  const seg = p.boost > 0 ? 7 : 5.5;
  for (let iter = 0; iter < 4; iter++) {
    for (let i = 1; i < scarf.length; i++) {
      const a = scarf[i - 1], b = scarf[i];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1e-6;
      const k = (d - seg) / d;
      if (i === 1) {
        b.x -= dx * k;
        b.y -= dy * k;
      } else {
        a.x += dx * k * 0.5;
        a.y += dy * k * 0.5;
        b.x -= dx * k * 0.5;
        b.y -= dy * k * 0.5;
      }
    }
  }
}

// ---------- Entities: coins and jaguars ----------
// Spawning is driven by the right edge of the view: patterns are created just off-screen,
// and anything that scrolls past the left edge is removed (coins go back to a pool).
function removeAt(arr, i) {
  // Order does not matter for entities, so swap with the last item for O(1) removal
  arr[i] = arr[arr.length - 1];
  arr.pop();
}

function spawnCoin(x, y) {
  const c = coinPool.pop() || {};
  c.x = x;
  c.y = y;
  c.phase = Math.random() * TAU;
  coins.push(c);
}

// Places one pattern starting at startX and returns its length in world units
function spawnCoinPattern(startX) {
  if (Math.random() < 0.5) {
    // A line that hugs the snow: collected just by riding through it
    const n = 5 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const x = startX + i * 42;
      spawnCoin(x, groundY(x) - 28);
    }
    return n * 42;
  }
  // An arc above the slope: needs a well-timed jump
  const n = 7;
  const peak = 90 + Math.random() * 60;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const x = startX + i * 44;
    spawnCoin(x, groundY(x) - 30 - Math.sin(t * Math.PI) * peak);
  }
  return n * 44;
}

function spawnJaguar(x) {
  const th = Math.atan(groundD1(x));
  const y = groundY(x);
  jaguars.push({
    x, y, px: x, py: y, angle: th, pa: th,
    speed: 330 + Math.random() * 140, // slower than a rider at cruising speed, so it can be caught
    phase: Math.random() * TAU
  });
}

function playerCenter() {
  // Torso centre in world space, following the board's rotation
  const c = Math.cos(p.angle), s = Math.sin(p.angle);
  const lx = 2, ly = -22;
  return { x: p.x + c * lx - s * ly, y: p.y + s * lx + c * ly };
}

function addPop(x, y, r0, r1, rgb, life) {
  pops.push({ x, y, r0, r1, rgb, t: 0, life });
}

function bumpScore() {
  const el = $('score');
  el.classList.remove('bump');
  void el.offsetWidth; // restart the CSS animation
  el.classList.add('bump');
}

function collectCoin(c) {
  coinCount++;
  bonus += COIN_POINTS;
  addPop(c.x, c.y, COIN_R, COIN_R * 3, '246, 196, 83', 0.35);
  for (let i = 0; i < 6; i++) {
    emit(c.x, c.y, (Math.random() - 0.5) * 240, -80 - Math.random() * 160,
         0.3 + Math.random() * 0.2, 1.5 + Math.random() * 1.5, C.gold);
  }
  bumpScore();
}

function catchJaguar(j) {
  jaguarCount++;
  bonus += JAGUAR_POINTS;
  addPop(j.x, j.y - 16, 16, 70, '246, 196, 83', 0.5);
  addPop(j.x, j.y - 16, 8, 45, '255, 255, 255', 0.35);
  for (let i = 0; i < 18; i++) {
    const a = -Math.PI * Math.random();
    const s = 120 + Math.random() * 260;
    emit(j.x, j.y - 16, Math.cos(a) * s, Math.sin(a) * s, 0.5 + Math.random() * 0.4,
         2 + Math.random() * 2.5, i % 3 === 0 ? C.spots : (i % 2 ? C.jaguar : C.gold));
  }
  p.boost = Math.max(p.boost, 0.6);
  addShake(4);
  toast('Jaguar caught  +' + JAGUAR_POINTS);
  bumpScore();
}

function stepEntities(dt) {
  const left = cam.x - DESPAWN_MARGIN;
  const edge = cam.x + viewW + SPAWN_MARGIN;

  // Spawn: fill everything up to just beyond the right edge
  if (state === 'playing') {
    while (nextCoinX < edge) {
      nextCoinX += spawnCoinPattern(nextCoinX) + 350 + Math.random() * 650;
    }
    if (nextJaguarX < edge) {
      spawnJaguar(edge);
      nextJaguarX = edge + 2600 + Math.random() * 3200;
    }
  }

  // Move jaguars along the terrain: a little slower uphill, a little faster downhill
  for (const j of jaguars) {
    j.px = j.x; j.py = j.y; j.pa = j.angle;
    const th = Math.atan(groundD1(j.x));
    const v = j.speed * (1 + 0.35 * Math.sin(th));
    j.x += v * Math.cos(th) * dt;
    j.y = groundY(j.x);
    j.angle = lerpAngle(j.angle, th, smoothing(12, dt));
    j.phase += v * dt * 0.045;
  }

  // Collision: circle against circle, checked every physics step.
  // Movement per step (at most about 13 units) is smaller than the combined radii, so nothing is skipped.
  if (state === 'playing') {
    const pc = playerCenter();
    const coinReach = (PLAYER_HIT_R + COIN_R) * (PLAYER_HIT_R + COIN_R);
    for (let i = coins.length - 1; i >= 0; i--) {
      const dx = coins[i].x - pc.x, dy = coins[i].y - pc.y;
      if (dx * dx + dy * dy < coinReach) {
        collectCoin(coins[i]);
        coinPool.push(coins[i]);
        removeAt(coins, i);
      }
    }
    const jagReach = (PLAYER_HIT_R + 22) * (PLAYER_HIT_R + 22);
    for (let i = jaguars.length - 1; i >= 0; i--) {
      const dx = jaguars[i].x - pc.x, dy = jaguars[i].y - 16 - pc.y;
      if (dx * dx + dy * dy < jagReach) {
        catchJaguar(jaguars[i]);
        removeAt(jaguars, i);
      }
    }
  }

  // Despawn: anything behind the view, and jaguars that escaped far ahead
  for (let i = coins.length - 1; i >= 0; i--) {
    if (coins[i].x < left) { coinPool.push(coins[i]); removeAt(coins, i); }
  }
  for (let i = jaguars.length - 1; i >= 0; i--) {
    if (jaguars[i].x < left || jaguars[i].x > cam.x + viewW * 4) removeAt(jaguars, i);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].t += dt;
    if (pops[i].t >= pops[i].life) removeAt(pops, i);
  }
}

// ---------- Main update (fixed timestep) ----------
function update(dt) {
  time += dt;
  dayTime = (dayTime + dt / DAY_LENGTH) % 1;
  if (input.down) input.age += dt;

  // Remember the previous state so rendering can interpolate between steps
  p.px = p.x; p.py = p.y; p.pa = p.angle; p.ps = p.squash;
  cam.px = cam.x; cam.py = cam.y;

  if (state === 'playing') {
    if (p.air) stepAir(dt); else stepGround(dt);
  } else if (state === 'crashed') {
    stepCrash(dt);
  }
  p.squash = lerp(p.squash, 0, smoothing(9, dt));
  stepParticles(dt);
  stepScarf(dt);

  // Camera: pull back gently with speed, then lerp toward the target with frame-rate independent smoothing
  const speed = p.air ? Math.hypot(p.vx, p.vy) : p.v;
  const zoomTarget = 1 - ZOOM_OUT * clamp((speed - 400) / 1100, 0, 1);
  cam.zoom = lerp(cam.zoom, zoomTarget, smoothing(1.5, dt));
  applyZoom();
  cam.vel = lerp(cam.vel, (p.x - p.px) / dt, smoothing(3, dt));
  cam.x = lerp(cam.x, camTargetX(), smoothing(CAM_FOLLOW_X, dt));
  cam.y = lerp(cam.y, camTargetY(), smoothing(CAM_FOLLOW_Y, dt));
  cam.shake = lerp(cam.shake, 0, smoothing(10, dt));

  stepEntities(dt);

  // Drop carve points that have scrolled off the left edge
  while (trail.length && (trail[0] === null || trail[0].x < cam.x - 40)) trail.shift();
}

// ---------- HUD ----------
let lastHud = '';
function distance() { return Math.max(0, Math.floor(p.x / PX_PER_M)); }
function score() { return distance() + bonus; }
function updateHud() {
  const d = distance(), s = score();
  const key = d + '|' + s + '|' + best + '|' + coinCount + '|' + jaguarCount;
  if (key === lastHud) return;
  lastHud = key;
  $('dist').textContent = d.toLocaleString('en-US') + ' m';
  $('score').textContent = 'Score ' + s.toLocaleString('en-US');
  $('haul').textContent = 'Coins ' + coinCount +
    (jaguarCount ? '  ' + DOT + '  Jaguars ' + jaguarCount : '');
  $('best').textContent = 'Best ' + best.toLocaleString('en-US');
}
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth; // restart the CSS animation
  el.classList.add('show');
}
function showGameOver() {
  const s = score();
  if (s > best) { best = s; saveBest(); }
  $('oDist').textContent = distance().toLocaleString('en-US');
  $('oScore').textContent = s.toLocaleString('en-US');
  $('oBest').textContent = best.toLocaleString('en-US');
  $('intro').hidden = true;
  $('over').hidden = false;
  $('panel').hidden = false;
}

// ---------- Day/night cycle ----------
// dayTime runs from 0 to 1 and wraps. Each key holds a full palette; the live palette L
// is a smoothstep blend of the two keys around the current time.
const DAY_LENGTH = 160;      // seconds for one full day
const SUN_RISE = 0.17, SUN_SET = 0.81;
const MOON_RISE = 0.77, MOON_SPAN = 0.46;
let dayTime = 0.24;          // start in the morning

// Colors are [r, g, b] or [r, g, b, a]; numbers blend linearly
const PALETTES = {
  night: {
    skyTop: [10, 14, 34], skyMid: [24, 30, 68], skyLow: [48, 56, 102],
    far: [46, 52, 94], mid: [36, 42, 80], near: [26, 31, 62], cap: [150, 162, 204],
    haze: [58, 68, 118, 0.3], snow: [170, 180, 216], rim: [152, 162, 202],
    shade1: [130, 140, 184], shade2: [104, 114, 162], tree: [18, 22, 46],
    light: [190, 206, 255], stars: 1
  },
  dawn: {
    skyTop: [62, 74, 138], skyMid: [214, 140, 160], skyLow: [255, 196, 150],
    far: [172, 142, 178], mid: [134, 110, 152], near: [92, 78, 124], cap: [255, 230, 222],
    haze: [255, 190, 160, 0.32], snow: [250, 238, 238], rim: [238, 222, 228],
    shade1: [216, 202, 218], shade2: [186, 172, 202], tree: [58, 52, 92],
    light: [255, 202, 160], stars: 0.1
  },
  day: {
    skyTop: [58, 124, 206], skyMid: [128, 184, 234], skyLow: [208, 232, 248],
    far: [152, 178, 216], mid: [114, 142, 192], near: [78, 104, 158], cap: [250, 252, 255],
    haze: [222, 238, 250, 0.38], snow: [246, 249, 255], rim: [228, 236, 248],
    shade1: [206, 218, 238], shade2: [178, 194, 224], tree: [42, 68, 96],
    light: [255, 250, 236], stars: 0
  },
  dusk: {
    skyTop: [39, 49, 92], skyMid: [140, 111, 159], skyLow: [242, 165, 138],
    far: [154, 139, 187], mid: [124, 108, 165], near: [97, 90, 146], cap: [255, 222, 210],
    haze: [242, 165, 138, 0.3], snow: [238, 240, 248], rim: [228, 230, 243],
    shade1: [214, 217, 236], shade2: [193, 196, 222], tree: [58, 63, 107],
    light: [255, 190, 150], stars: 0.15
  }
};
const DAY_KEYS = [
  [0, 'night'], [0.14, 'night'], [0.22, 'dawn'], [0.32, 'day'],
  [0.62, 'day'], [0.74, 'dusk'], [0.84, 'night'], [1, 'night']
];

const L = {};                // live, blended palette
let lightDirX = 0;           // -1 when the light source is at the far left, 1 at the far right
let lightPower = 1;          // 0 in deep night, 1 at noon
let sunPos = null, moonPos = null;

const stars = [];
for (let i = 0; i < 160; i++) {
  stars.push({
    x: Math.random(), y: Math.random() * 0.6, r: 0.5 + Math.random() * 1.1,
    ph: Math.random() * TAU, sp: 1 + Math.random() * 3, b: 0.4 + Math.random() * 0.6
  });
}

function smoothstep(t) { return t * t * (3 - 2 * t); }
function css(c, alphaMul) {
  const a = (c.length > 3 ? c[3] : 1) * (alphaMul === undefined ? 1 : alphaMul);
  return 'rgba(' + (c[0] | 0) + ', ' + (c[1] | 0) + ', ' + (c[2] | 0) + ', ' + a.toFixed(3) + ')';
}
function mixColor(a, b, k) {
  const out = [];
  for (let i = 0; i < a.length; i++) out.push(a[i] + (b[i] - a[i]) * k);
  return out;
}

function updateLighting() {
  const t = dayTime;
  let i = 0;
  while (i < DAY_KEYS.length - 2 && t >= DAY_KEYS[i + 1][0]) i++;
  const ta = DAY_KEYS[i][0], tb = DAY_KEYS[i + 1][0];
  const A = PALETTES[DAY_KEYS[i][1]], B = PALETTES[DAY_KEYS[i + 1][1]];
  const k = smoothstep(clamp((t - ta) / (tb - ta), 0, 1));
  for (const key in A) {
    L[key] = Array.isArray(A[key]) ? mixColor(A[key], B[key], k) : lerp(A[key], B[key], k);
  }

  // Sun and moon travel along arcs that rise from and set behind the far mountains
  const horizon = H * 0.62;
  const s = (t - SUN_RISE) / (SUN_SET - SUN_RISE);
  sunPos = s > 0 && s < 1 ? { x: W * (0.08 + 0.84 * s), y: horizon - Math.sin(s * Math.PI) * H * 0.5 } : null;
  const m = (((t - MOON_RISE) % 1) + 1) % 1 / MOON_SPAN;
  moonPos = m < 1 ? { x: W * (0.08 + 0.84 * m), y: horizon - Math.sin(m * Math.PI) * H * 0.45 } : null;

  if (sunPos) {
    lightDirX = (s - 0.5) * 2;
    lightPower = Math.sin(s * Math.PI);
  } else if (moonPos) {
    lightDirX = (m - 0.5) * 2;
    lightPower = 0.4 * Math.sin(m * Math.PI);
  } else {
    lightDirX = 0;
    lightPower = 0;
  }
}

function drawSky(camX) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, css(L.skyTop));
  g.addColorStop(0.5, css(L.skyMid));
  g.addColorStop(0.82, css(L.skyLow));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Stars fade in with night and twinkle; they drift very slightly with the camera
  if (L.stars > 0.01) {
    ctx.fillStyle = '#ffffff';
    const drift = camX * scale * 0.01;
    for (const st of stars) {
      const tw = 0.6 + 0.4 * Math.sin(time * st.sp + st.ph);
      ctx.globalAlpha = L.stars * tw * st.b;
      const x = ((st.x * W - drift) % W + W) % W;
      ctx.fillRect(x, st.y * H, st.r, st.r);
    }
    ctx.globalAlpha = 1;
  }

  const unit = Math.min(W, H);
  if (sunPos) {
    const glow = ctx.createRadialGradient(sunPos.x, sunPos.y, 0, sunPos.x, sunPos.y, unit * 0.4);
    glow.addColorStop(0, css(L.light, 0.45));
    glow.addColorStop(1, css(L.light, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(sunPos.x - unit * 0.4, sunPos.y - unit * 0.4, unit * 0.8, unit * 0.8);
    ctx.fillStyle = css(mixColor(L.light, [255, 255, 255], 0.55));
    ctx.beginPath();
    ctx.arc(sunPos.x, sunPos.y, unit * 0.055, 0, TAU);
    ctx.fill();
  }
  if (moonPos) {
    const r = unit * 0.04;
    const glow = ctx.createRadialGradient(moonPos.x, moonPos.y, r, moonPos.x, moonPos.y, r * 5);
    glow.addColorStop(0, 'rgba(200, 214, 255, 0.22)');
    glow.addColorStop(1, 'rgba(200, 214, 255, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(moonPos.x - r * 5, moonPos.y - r * 5, r * 10, r * 10);
    ctx.fillStyle = '#eef1fb';
    ctx.beginPath();
    ctx.arc(moonPos.x, moonPos.y, r, 0, TAU);
    ctx.fill();
    // Craters
    ctx.fillStyle = 'rgba(160, 170, 205, 0.45)';
    ctx.beginPath();
    ctx.arc(moonPos.x - r * 0.3, moonPos.y - r * 0.2, r * 0.22, 0, TAU);
    ctx.moveTo(moonPos.x + r * 0.45, moonPos.y + r * 0.25);
    ctx.arc(moonPos.x + r * 0.3, moonPos.y + r * 0.25, r * 0.15, 0, TAU);
    ctx.moveTo(moonPos.x + r * 0.1, moonPos.y - r * 0.5);
    ctx.arc(moonPos.x, moonPos.y - r * 0.5, r * 0.1, 0, TAU);
    ctx.fill();
  }
}

// Atmospheric haze: thickens toward the bottom of each band, pushing far layers back
function drawHaze(topFrac, bottomFrac, strength) {
  const g = ctx.createLinearGradient(0, H * topFrac, 0, H * bottomFrac);
  g.addColorStop(0, css(L.haze, 0));
  g.addColorStop(1, css(L.haze, strength));
  ctx.fillStyle = g;
  ctx.fillRect(0, H * topFrac, W, H * (1 - topFrac));
}

// Falling snow catches the light: brighter and warmer near the sun, dim and blue at night
function drawFlakes(camX, frameDt) {
  const camDx = (camX - cam.renderX) * scale;
  cam.renderX = camX;
  const flakeColor = css(mixColor([255, 255, 255], L.light, 0.45));
  const glintR = Math.min(W, H) * 0.6;
  ctx.fillStyle = flakeColor;
  for (const f of flakes) {
    f.y += f.s * frameDt;
    f.x -= camDx * f.z + 18 * frameDt;
    if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; }
    if (f.x < -4) f.x += W + 8;
    if (f.x > W + 4) f.x -= W + 8;
    let glint = 0;
    if (sunPos) {
      const d = Math.hypot(f.x - sunPos.x, f.y - sunPos.y);
      glint = Math.max(0, 1 - d / glintR) * lightPower;
    }
    const sparkle = 0.85 + 0.15 * Math.sin(time * 9 + f.x * 0.05);
    ctx.globalAlpha = clamp((0.35 + 0.3 * lightPower + 0.45 * glint) * sparkle, 0, 1);
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * (1 + glint * 0.4), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- Rendering ----------
function seedFlakes() {
  flakes.length = 0;
  if (reducedMotion) return;
  const count = clamp(Math.round((W * H) / 16000), 30, 110);
  for (let i = 0; i < count; i++) {
    flakes.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.8 + Math.random() * 1.6, s: 18 + Math.random() * 48, z: 0.2 + Math.random() * 0.4
    });
  }
}

const ridgeBuf = [];
function drawRange(camX, color, factor, baseFrac, a1, a2, f1, f2, seed, detail) {
  // Three stacked triangle waves give crisp flat-design peaks with secondary ridges.
  // factor sets parallax depth; detail adds snow caps or a treeline.
  const off = camX * scale * factor;
  const base = H * baseFrac;
  const a3 = a2 * 0.35;
  const ridge = (u) => base - H * (a1 * tri(u * f1 + seed) + a2 * tri(u * f2 + seed * 2.3) + a3 * tri(u * f2 * 2.7 + seed * 3.1));
  const n = Math.ceil(W / 4) + 2;
  for (let i = 0; i < n; i++) ridgeBuf[i] = ridge(i * 4 + off);

  // Body: lit from above, so the top of the layer picks up the light color
  const top = base - H * (a1 + a2 + a3);
  const g = ctx.createLinearGradient(0, top, 0, base);
  g.addColorStop(0, css(mixColor(color, L.light, 0.12 + 0.12 * lightPower)));
  g.addColorStop(1, css(color));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < n; i++) ctx.lineTo(i * 4, ridgeBuf[i]);
  ctx.lineTo((n - 1) * 4, H);
  ctx.closePath();
  ctx.fill();

  if (detail === 'cap') {
    // Snow caps: the strip between the ridge and a wavy snow line, only where peaks rise above it
    const capLine = base - H * (a1 + a2) * 0.6;
    ctx.fillStyle = css(mixColor(L.cap, L.light, 0.25 * lightPower));
    ctx.beginPath();
    ctx.moveTo(0, ridgeBuf[0]);
    for (let i = 0; i < n; i++) ctx.lineTo(i * 4, ridgeBuf[i]);
    for (let i = n - 1; i >= 0; i--) {
      const wave = Math.sin((i * 4 + off) * 0.045) * H * 0.008;
      ctx.lineTo(i * 4, Math.max(ridgeBuf[i], capLine + wave));
    }
    ctx.closePath();
    ctx.fill();
  } else if (detail === 'trees') {
    // Treeline anchored to layer space, so trees scroll with the layer instead of shimmering
    ctx.fillStyle = css(mixColor(color, [0, 0, 0], 0.25));
    ctx.beginPath();
    const gap = 9;
    for (let u = Math.floor(off / gap) * gap; u < off + W + gap; u += gap) {
      const hgt = 7 + hash(u * 0.37) * 12;
      const sx = u - off;
      const y = ridge(u) + 3;
      ctx.moveTo(sx - 3.5, y);
      ctx.lineTo(sx, y - hgt);
      ctx.lineTo(sx + 3.5, y);
    }
    ctx.fill();
  }
}

function groundPath(offset, x0, x1, bottom, stepSize) {
  ctx.beginPath();
  ctx.moveTo(x0, bottom);
  for (let x = x0; x <= x1; x += stepSize) ctx.lineTo(x, groundY(x) + offset);
  ctx.lineTo(x1, groundY(x1) + offset);
  ctx.lineTo(x1, bottom);
  ctx.closePath();
  ctx.fill();
}

function drawPine(x, y, s) {
  ctx.fillStyle = css(L.tree);
  ctx.fillRect(x - 2.5 * s, y - 10 * s, 5 * s, 12 * s);
  for (let k = 0; k < 3; k++) {
    const w = 24 * s * (1 - k * 0.24);
    const by = y - 8 * s - k * 17 * s;
    ctx.beginPath();
    ctx.moveTo(x - w, by);
    ctx.lineTo(x + w, by);
    ctx.lineTo(x, by - 30 * s);
    ctx.closePath();
    ctx.fill();
  }
}

function drawTrail(tipX, tipY, onGround) {
  // Carve line: a soft groove in the snow, broken wherever the rider was airborne
  ctx.strokeStyle = css(L.shade2, 0.7);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  let open = false;
  for (const t of trail) {
    if (t === null) { open = false; continue; }
    if (open) ctx.lineTo(t.x, t.y); else { ctx.moveTo(t.x, t.y); open = true; }
  }
  // Connect the newest point to the board so the line never lags behind it
  if (open && onGround) ctx.lineTo(tipX, groundY(tipX) + 1.5);
  ctx.stroke();
}

// Soft contact shadow on the slope. It is pushed away from the light and shrinks
// and fades as the object rises, which gives entities a 2.5D sense of height.
function castShadow(x, height, width) {
  const k = clamp(1 - height / 420, 0.15, 1);
  const sx = x - lightDirX * (6 + height * 0.25);
  const gy = groundY(sx);
  const alpha = (0.1 + 0.12 * Math.max(lightPower, 0.25)) * k;
  ctx.save();
  ctx.translate(sx, gy + 1);
  ctx.rotate(Math.atan(groundD1(sx)));
  ctx.fillStyle = 'rgba(20, 24, 50, ' + alpha.toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(0, 0, width * k, 3.5 * k + 1, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// Sparkles where the snow surface catches the light
function drawGlints(x0, x1) {
  if (lightPower < 0.05) return;
  const cell = 37;
  ctx.fillStyle = css(mixColor([255, 255, 255], L.light, 0.3));
  for (let i = Math.floor(x0 / cell); i <= Math.floor(x1 / cell); i++) {
    const h = hash(i * 3.7 + 1);
    if (h > 0.2) continue;
    const tw = Math.sin(time * 2.2 + h * 90);
    if (tw < 0.6) continue;
    const gx = i * cell + h * 30;
    const gy = groundY(gx) + 3 + hash(i) * 10;
    const s = 2 + 3 * (tw - 0.6) / 0.4;
    ctx.globalAlpha = ((tw - 0.6) / 0.4) * lightPower * 0.9;
    ctx.fillRect(gx - s, gy - 0.5, s * 2, 1);
    ctx.fillRect(gx - 0.5, gy - s, 1, s * 2);
  }
  ctx.globalAlpha = 1;
}

function drawCoin(c) {
  // Spin by squashing the width; bob gently up and down
  const y = c.y + Math.sin(time * 3 + c.phase) * 2.5;
  const w = Math.abs(Math.cos(time * 3.5 + c.phase));
  const rx = Math.max(1.5, COIN_R * w);
  if (L.stars > 0.2) {
    ctx.fillStyle = 'rgba(246, 196, 83, ' + (0.16 * L.stars).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(c.x, y, COIN_R * 2.2, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = C.goldDark;
  ctx.beginPath();
  ctx.ellipse(c.x, y, rx, COIN_R, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = C.gold;
  ctx.beginPath();
  ctx.ellipse(c.x, y, Math.max(1, rx * 0.72), COIN_R * 0.72, 0, 0, TAU);
  ctx.fill();
  if (w > 0.4) {
    ctx.fillStyle = C.goldLight;
    ctx.beginPath();
    ctx.ellipse(c.x - rx * 0.25, y - COIN_R * 0.3, rx * 0.18, COIN_R * 0.22, 0, 0, TAU);
    ctx.fill();
  }
}

const JAGUAR_SPOTS = [[-19, -14], [-14, -19], [-7, -13], [0, -19], [7, -14], [14, -19]];
// Gallop: the back pair and the front pair each move together, slightly offset
const JAGUAR_LEGS = [[-15, Math.PI], [-9, Math.PI + 0.6], [11, 0], [17, 0.6]];

function drawJaguar(j, alpha) {
  const x = lerp(j.px, j.x, alpha);
  const y = lerp(j.py, j.y, alpha);
  const a = lerpAngle(j.pa, j.angle, alpha);
  const bob = Math.sin(j.phase * 2) * 1.2;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.lineCap = 'round';
  // Legs
  ctx.strokeStyle = C.jaguarDark;
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (const [hx, off] of JAGUAR_LEGS) {
    const swing = Math.sin(j.phase + off);
    const lift = Math.max(0, Math.cos(j.phase + off)) * 3;
    ctx.moveTo(hx, -12 + bob);
    ctx.lineTo(hx + swing * 7, -1 - lift);
  }
  ctx.stroke();
  // Tail
  ctx.strokeStyle = C.jaguar;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(-21, -17 + bob);
  ctx.quadraticCurveTo(-34, -18 + bob, -40, -27 + Math.sin(j.phase) * 4);
  ctx.stroke();
  // Body and head
  ctx.fillStyle = C.jaguar;
  ctx.beginPath();
  ctx.ellipse(0, -16 + bob, 24, 8.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(120, 70, 20, 0.35)';
  ctx.beginPath();
  ctx.ellipse(0, -12.5 + bob, 20, 4.5, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = css(L.light, 0.12 + 0.25 * lightPower);
  ctx.beginPath();
  ctx.ellipse(1, -21.5 + bob, 17, 2.2, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = C.jaguar;
  ctx.beginPath();
  ctx.arc(25, -21 + bob, 7.5, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(31, -18.5 + bob, 4.5, 3.5, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(19, -26 + bob); ctx.lineTo(20.5, -32 + bob); ctx.lineTo(24, -27.5 + bob);
  ctx.moveTo(25, -28 + bob); ctx.lineTo(27.5, -33 + bob); ctx.lineTo(29.5, -27 + bob);
  ctx.fill();
  // Rosettes and eye
  ctx.fillStyle = C.spots;
  ctx.beginPath();
  for (const [sx, sy] of JAGUAR_SPOTS) {
    ctx.moveTo(sx + 1.8, sy + bob);
    ctx.arc(sx, sy + bob, 1.8, 0, TAU);
  }
  ctx.moveTo(28.4, -23 + bob);
  ctx.arc(27.2, -23 + bob, 1.2, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawScarf(neck, alpha) {
  // Smooth curve through interpolated rope points, starting at the rendered neck
  const pts = [neck];
  for (let i = 1; i < scarf.length; i++) {
    pts.push({ x: lerp(scarf[i].px, scarf[i].x, alpha), y: lerp(scarf[i].py, scarf[i].y, alpha) });
  }
  ctx.strokeStyle = C.scarf;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2;
    const my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const lastPt = pts[pts.length - 1];
  ctx.lineTo(lastPt.x, lastPt.y);
  ctx.stroke();
}

function drawRider(x, y, angle, squash) {
  // squash > 0 crouches (landing), squash < 0 stretches (take-off)
  const dip = squash * 7;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.strokeStyle = C.ink;
  ctx.fillStyle = C.ink;
  ctx.lineCap = 'round';
  // Board with upturned tips
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-25, -6);
  ctx.quadraticCurveTo(-22, -2, -16, -2);
  ctx.lineTo(16, -2);
  ctx.quadraticCurveTo(22, -2, 25, -6);
  ctx.stroke();
  // Legs bend at the knee as the rider crouches
  const knee = -10 + dip * 0.5;
  const hip = -16 + dip;
  ctx.beginPath();
  ctx.moveTo(-7, -4); ctx.lineTo(-6 - dip * 0.4, knee); ctx.lineTo(-1, hip);
  ctx.moveTo(7, -4); ctx.lineTo(7 + dip * 0.4, knee); ctx.lineTo(2, hip);
  ctx.stroke();
  // Torso
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(1, hip - 1); ctx.lineTo(3, -29 + dip);
  ctx.stroke();
  // Head
  ctx.beginPath();
  ctx.arc(4, -38 + dip, 6.5, 0, TAU);
  ctx.fill();
  // Rim light: rotate the world light direction into the rider's local space
  const lx = Math.cos(angle) * lightDirX + Math.sin(angle) * -0.8;
  const ly = -Math.sin(angle) * lightDirX + Math.cos(angle) * -0.8;
  const len = Math.hypot(lx, ly) || 1;
  const ox = (lx / len) * 2.6, oy = (ly / len) * 2.6;
  ctx.strokeStyle = ctx.fillStyle = css(L.light, 0.2 + 0.45 * lightPower);
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(1 + ox, hip - 1 + oy); ctx.lineTo(3 + ox, -29 + dip + oy);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(4 + ox * 1.1, -38 + dip + oy * 1.1, 2.6, 0, TAU);
  ctx.fill();
  ctx.restore();
}

// alpha: how far the render time sits between the last two physics steps (0..1)
function render(alpha, frameDt) {
  const camX = lerp(cam.px, cam.x, alpha);
  const camY = lerp(cam.py, cam.y, alpha);
  const rx = lerp(p.px, p.x, alpha);
  const ry = lerp(p.py, p.y, alpha);
  const ra = lerpAngle(p.pa, p.angle, alpha);
  const rs = lerp(p.ps, p.squash, alpha);
  // Smooth, low-frequency shake (no per-frame random jitter)
  const shakeX = cam.shake * Math.sin(time * 61);
  const shakeY = cam.shake * Math.sin(time * 47 + 1.3);

  updateLighting();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Background: sky, celestial bodies, then three mountain layers separated by haze
  drawSky(camX);
  drawRange(camX, L.far, 0.05, 0.64, 0.24, 0.07, 1 / 520, 1 / 190, 0.3, 'cap');
  drawHaze(0.35, 0.68, 0.55);
  drawRange(camX, L.mid, 0.1, 0.71, 0.17, 0.06, 1 / 420, 1 / 160, 2.9, 'cap');
  drawHaze(0.5, 0.8, 0.75);
  drawRange(camX, L.near, 0.18, 0.79, 0.12, 0.05, 1 / 330, 1 / 120, 1.7, 'trees');
  drawHaze(0.62, 0.95, 1);
  drawFlakes(camX, frameDt);

  // World layer
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale,
    (-camX * scale + shakeX) * dpr, (-camY * scale + shakeY) * dpr);
  const x0 = camX - 20, x1 = camX + viewW + 20, bottom = camY + viewH + 60;

  // Trees sit behind the snow surface so their trunks look planted
  const cell = 170;
  for (let i = Math.floor(x0 / cell) - 1; i <= Math.floor(x1 / cell) + 1; i++) {
    if (hash(i) < 0.32) {
      const tx = i * cell + hash(i * 1.37 + 9) * 120;
      drawPine(tx, groundY(tx) + 8, 0.6 + hash(i + 77) * 0.9);
    }
  }
  // Layered snow strata; sample density follows zoom so the edge stays smooth
  const stepSize = Math.max(3, 6 / scale);
  ctx.fillStyle = css(L.snow);
  groundPath(0, x0, x1, bottom, stepSize);
  ctx.fillStyle = css(L.rim);
  groundPath(16, x0, x1, bottom, stepSize);
  ctx.fillStyle = css(L.shade1);
  groundPath(70, x0, x1, bottom, stepSize);
  ctx.fillStyle = css(L.shade2);
  groundPath(180, x0, x1, bottom, stepSize);

  // A thin rim of light along the crest of the snow
  ctx.strokeStyle = css(mixColor([255, 255, 255], L.light, 0.5), 0.25 + 0.5 * lightPower);
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x0, groundY(x0));
  for (let x = x0; x <= x1; x += stepSize) ctx.lineTo(x, groundY(x));
  ctx.stroke();
  drawGlints(x0, x1);

  const onGround = state === 'playing' && !p.air;
  drawTrail(rx - Math.cos(ra) * 14, ry, onGround);

  // Shadows first, so every entity sits on top of its own shadow
  for (const c of coins) {
    if (c.x > x0 && c.x < x1) castShadow(c.x, groundY(c.x) - c.y, COIN_R * 0.9);
  }
  for (const j of jaguars) {
    if (j.x > x0 - 50 && j.x < x1 + 50) castShadow(lerp(j.px, j.x, alpha), 0, 24);
  }
  castShadow(rx, Math.max(0, groundY(rx) - ry), 24);

  for (const r of rings) {
    const k = r.t / 0.5;
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + (0.8 * (1 - k)).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, 20 + k * 70, 5 + k * 16, Math.atan(groundD1(r.x)), 0, TAU);
    ctx.stroke();
  }

  // Entities: only those inside the visible strip are drawn
  for (const c of coins) {
    if (c.x > x0 - COIN_R && c.x < x1 + COIN_R) drawCoin(c);
  }
  for (const j of jaguars) {
    if (j.x > x0 - 50 && j.x < x1 + 50) drawJaguar(j, alpha);
  }
  ctx.lineWidth = 2;
  for (const pp of pops) {
    const k = pp.t / pp.life;
    ctx.strokeStyle = 'rgba(' + pp.rgb + ', ' + (1 - k).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, lerp(pp.r0, pp.r1, 1 - (1 - k) * (1 - k)), 0, TAU);
    ctx.stroke();
  }

  for (const q of particles) {
    ctx.globalAlpha = q.life / q.max;
    ctx.fillStyle = q.color;
    ctx.beginPath();
    ctx.arc(lerp(q.px, q.x, alpha), lerp(q.py, q.y, alpha), q.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawScarf(neckAt(rx, ry, ra, rs), alpha);
  drawRider(rx, ry, ra, rs);

  updateHud();
}

// ---------- Loop: fixed-timestep physics with interpolated rendering ----------
// Physics always advances in identical 1/120 s steps, so behaviour is the same at 60, 90, 144 or 240 Hz.
// Rendering blends the last two steps, so motion is smooth even when steps and frames do not line up.
let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(MAX_FRAME, Math.max(0, (t - last) / 1000));
  last = t;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render(acc / STEP, dt);
  rafId = requestAnimationFrame(frame);
}
function startLoop() {
  // Reset the clock on (re)start so a pause never produces a time jump
  rafId = requestAnimationFrame((t) => { last = t; acc = 0; frame(t); });
}

function boot(data) {
  best = Math.max(loadBest(), (data && data.best) || 0);
  measure();
  updateLighting();
  reset();
  seedFlakes();
  startLoop();
}

window.claude?.hot?.snapshot?.(() => ({ best }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
